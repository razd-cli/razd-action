name: 'razd-cli/razd-action'
description: 'GitHub Action to set up mise and razd CLI (mise provisioner)'
author: 'razd-cli'
branding:
  icon: 'package'
  color: 'blue'
inputs:
  mise-version:
    description: 'mise version'
    required: true
    default: '2025.6.6'
  razd-version:
    description: 'razd version (e.g. "1.2.3") or "latest"'
    required: false
    default: 'latest'
  checkout-repository:
    description: 'checkout repository'
    required: false
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      if: ${{ inputs.checkout-repository == 'true' }}
    - name: Setup mise and install tools
      uses: jdx/mise-action@v2
      with:
        version: ${{ inputs.mise-version }}
        install: false
        cache: true
        experimental: true
    - name: Install razd
      shell: bash
      env:
        RAZD_VERSION: ${{ inputs.razd-version }}
      run: |
        set -e
        
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64)  ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
          arm64)   ARCH="arm64" ;;
          *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        
        if [ "$RAZD_VERSION" = "latest" ]; then
          RAZD_VERSION=$(curl -sL https://api.github.com/repos/razd-cli/razd/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          if [ -z "$RAZD_VERSION" ]; then
            echo "Failed to determine latest razd version"
            exit 1
          fi
          echo "Latest razd version: $RAZD_VERSION"
        fi
        
        echo "Installing razd v${RAZD_VERSION} for ${OS}_${ARCH}..."
        curl -sL "https://github.com/razd-cli/razd/releases/download/v${RAZD_VERSION}/razd_${OS}_${ARCH}.tar.gz" | tar xz -C /usr/local/bin razd
        
        echo "razd v${RAZD_VERSION} installed"
    - name: Verify installations
      run: mise list
      shell: bash
    - name: Verify razd
      run: razd --version
      shell: bash