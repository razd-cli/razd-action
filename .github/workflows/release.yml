name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          cat > changelog.md << 'EOF'
          ## What's New
          
          EOF
          
          if [ -n "$PREV_TAG" ]; then
            echo "### Changes since $PREV_TAG" >> changelog.md
            echo "" >> changelog.md
            
            git log --pretty=format:"%s" $PREV_TAG..HEAD | while read commit; do
              if echo "$commit" | grep -i "^feat\|^add\|^new"; then
                echo "- **Feature:** $commit" >> changelog.md
              elif echo "$commit" | grep -i "^fix\|^bug"; then
                echo "- **Fix:** $commit" >> changelog.md  
              elif echo "$commit" | grep -i "^doc\|^readme"; then
                echo "- **Docs:** $commit" >> changelog.md
              elif echo "$commit" | grep -i "^refactor\|^improve"; then
                echo "- **Improvement:** $commit" >> changelog.md
              else
                echo "- $commit" >> changelog.md
              fi
            done
          fi
          
          cat >> changelog.md << EOF
          
          ## Quick Start
          
          \`\`\`yaml
          - uses: razd-cli/razd-action@${{ steps.tag.outputs.TAG_NAME }}
          \`\`\`
          
          With options:
          \`\`\`yaml  
          - uses: razd-cli/razd-action@${{ steps.tag.outputs.TAG_NAME }}
            with:
              mise-version: '2025.6.6'
              razd-version: 'latest'
              checkout-repository: 'true'
          \`\`\`
          
          ## Parameters
          
          | Parameter | Description | Default |
          |-----------|-------------|---------|
          | \`mise-version\` | Version of mise to install | \`2025.6.6\` |
          | \`razd-version\` | Version of razd to install (\`latest\` or specific version) | \`latest\` |
          | \`checkout-repository\` | Whether to checkout repository | \`true\` |
          
          ---
          **Full Changelog**: https://github.com/razd-cli/razd-action/compare/$PREV_TAG...${{ steps.tag.outputs.TAG_NAME }}
          EOF
          
          cat changelog.md
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          body_path: changelog.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update major version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME=${{ steps.tag.outputs.TAG_NAME }}
          MAJOR_VERSION=$(echo $TAG_NAME | cut -d. -f1)
          
          echo "Creating/updating major version tag: $MAJOR_VERSION"
          git tag -f $MAJOR_VERSION
          git push origin $MAJOR_VERSION --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}